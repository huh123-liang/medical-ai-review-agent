[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-ai-jury"
version = "0.1.0"
description = "Independent rubric-grounded medical output evaluation research agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "langgraph>=1,<2", "chromadb>=1,<2",
  "fastembed>=0.7,<1", "numpy>=1.26,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5"]
jury2 = ["dspy>=3.4,<3.5", "langgraph-checkpoint-sqlite>=3,<4"]

[project.scripts]
medical-jury = "medical_jury.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_v2"]
addopts = "-q"
